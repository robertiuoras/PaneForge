<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout C · Task-first</title>
<link rel="stylesheet" href="shared.css">
<style>.app{--nav-w:260px}.task-head{padding:18px 28px 0;border-bottom:0}.task-head .tabs-in{margin:14px 0 0}.canvas{padding-top:18px}</style>
</head>
<body data-layout="c">
<div class="app">
  <header class="topbar">
    <button class="btn quiet menu-toggle" data-action="open-nav" aria-label="Open your work">☰</button>
    <div class="brand"><img src="../paneforge-directions/assets/brands/paneforge.svg" alt="PaneForge logo">PaneForge</div>
    <button class="btn" data-action="palette" style="margin-left:auto;min-width:240px;color:var(--muted)">Find anything… <span class="k" style="margin-left:auto;font-size:11px">⌘K</span></button>
    <div style="position:relative;display:flex;align-items:center;gap:10px">
      <button class="pill agent" data-action="agent-menu" aria-haspopup="menu" aria-expanded="false"><img data-bind="agent-img" alt=""> <span data-bind="agent-name">Codex</span> ▾</button>
      <div class="agent-menu" role="menu" hidden style="right:0;top:100%"></div>
      <span class="pill" aria-label="Private workspace, signed in as Robert">Private · R</span>
    </div>
  </header>

  <nav class="sidebar" aria-label="Your work">
    <button class="nav-btn" data-action="new-project">+ New project <span class="k">⌘N</span></button>
    <div class="task-list"></div>
    <div class="providers"><span>Sessions</span><img src="../paneforge-directions/assets/brands/codex.svg" alt="Codex"><img src="../paneforge-directions/assets/brands/claude.svg" alt="Claude"><img src="../paneforge-directions/assets/brands/antigravity.png" alt="Antigravity"></div>
  </nav>

  <main class="main">
    <div class="task-head">
      <div class="eyebrow" data-bind="eyebrow">Harbour Studio / The launch plan</div>
      <div class="tabs-in" role="tablist" aria-label="This task">
        <button role="tab" data-action="tab:chat" aria-selected="true">Conversation</button>
        <button role="tab" data-action="tab:work" aria-selected="false">Result &amp; decisions</button>
        <button role="tab" data-action="tab:code" aria-selected="false">Code</button>
      </div>
    </div>
    <div class="canvas" data-inject></div>
  </main>

  <footer class="guide" aria-live="polite"><span class="say"></span><span class="steps"></span><span class="stats"></span></footer>
</div>
<div class="toast" role="status"></div>
<script src="shared.js"></script>
</body>
</html>
