<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PaneForge Stash</title>
    <!-- `media-src ... stash:` is what lets a stashed video draw its own first frame in a
         tile. `stash:` is main's own protocol and only ever serves one file already on the
         Stash, looked up by id - see the handler in main/index.ts. Without it Chromium
         refuses the load as "rejected by URL safety check", which is CSP, not the file. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' stash:"
    />
  </head>
  <body class="shelf-overlay-body">
    <div id="root"></div>
    <script type="module" src="/src/shelf.tsx"></script>
  </body>
</html>
