<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- The same page is served to a phone (src/main/phone.ts). Without this the browser
         lays it out at 980px and zooms out, so innerWidth never drops under 720 and
         handheld mode cannot fire. Electron ignores it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>PaneForge</title>
    <!-- Saved to a phone's home screen this is the whole app: a quick tunnel address is
         long and forgettable, so the icon IS the bookmark. `start_url`/`scope` are
         RELATIVE on purpose - the page is served from a LAN address, a tailnet address
         and a fresh trycloudflare hostname, and an absolute one would pin the icon to
         whichever host it was installed from. iOS ignores the manifest for installing,
         hence the apple-* pair beside it. -->
    <!-- `use-credentials` is load-bearing: a manifest is fetched WITHOUT cookies by
         default, and this server answers a cookie-less page request with the pairing
         page - so the install would silently read HTML as its manifest. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PaneForge" />
    <link rel="apple-touch-icon" href="pf-192.png" />
    <!-- The tab icon is the BARE mark, not the plated app icon: the plate's rounded
         corners are transparent, so on Chrome's near-white tab strip they read as a white
         ring around the icon (Safari's darker strip hid it). Ember on transparency has
         contrast either way and has no plate to ring.
         The .ico is not redundant - Chrome asks for /favicon.ico before it has parsed
         this tag, and phone.ts answers a missing file with index.html, so without one the
         first thing the browser gets for its icon is HTML. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.hf.co https://*.huggingface.co"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
