# Builds PaneForge for Windows and Apple Silicon and publishes both to a GitHub
# Release, which is also the feed the app's auto-updater reads.
#
# Triggered by pushing a tag (`npm run ship` does that for you), by a release being
# published, or by hand from the Actions tab. Public repo, so these minutes are free.
#
# The `release` trigger is the one that matters for Macs. A release cut on the Windows
# machine (`scripts/lane.mjs` -> electron-builder --publish always) creates its tag
# THROUGH THE API as part of the release, and GitHub fires no tag push event for that -
# so v0.3.42 through v0.3.50 never ran this workflow, never built a Mac, and every Mac
# running PaneForge sat on a permanent "update failed" because latest-mac.yml did not
# exist. A published release fires this and the Mac half gets built and uploaded.
# (A release published by GITHUB_TOKEN cannot re-trigger a workflow, so no loop.)

name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-14 # Apple Silicon runner: arm64 native, no cross-build
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The signing identity `scripts/mac-sign.mjs` uses in afterPack. It is self-signed,
      # so this buys nothing from Gatekeeper - what it buys is that macOS stops re-asking
      # for Documents/Desktop/Downloads/iCloud on every single update, because a signed
      # app's permission grants are keyed to the certificate instead of to the binary's
      # hash. Skipped without the secrets, and the build then says so and goes ad-hoc.
      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        run: node scripts/mac-cert.mjs import
        env:
          PF_CERT_P12: ${{ secrets.PF_CERT_P12 }}
          PF_CERT_PASSWORD: ${{ secrets.PF_CERT_PASSWORD }}

      - name: Build and publish
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder must not go looking for an Apple identity of its own: there is
          # none, notarising needs a paid account, and first launch still wants
          # right-click > Open. All signing here happens in afterPack.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # electron-builder's own publisher cannot be trusted to have uploaded anything.
      # When the release already exists and is published - which is the normal case
      # here, because the machine that cut the version created it minutes earlier -
      # its GitHub publisher quietly uploads nothing. That is how the 0.3.50 release
      # ended up with Windows metadata only: the Mac job went green having published
      # not one file. Upload the update feed and the versioned artifacts explicitly;
      # --clobber makes it idempotent when the publisher DID do its job.
      - name: Upload update feed and versioned artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          shopt -s nullglob
          files=(dist/latest*.yml dist/*"$version"*.exe dist/*"$version"*.dmg dist/*"$version"*.zip dist/*"$version"*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing built for $version"; exit 1; fi
          printf '%s\n' "${files[@]}"
          # --prerelease: every automatic release is cut on the dev channel. Stable
          # installs resolve /releases/latest, which skips prereleases, so nothing
          # reaches them until `lane.mjs promote` flips this flag off by hand.
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --prerelease --latest=false --title "$version" --notes ""
          # Retried, because the failure here is GitHub's and not ours: v0.8.83 uploaded
          # five mac assets and died on `HTTP 504: We couldn't respond to your request in
          # time` on the last one, which failed the whole release for a version that had
          # already built. `--clobber` makes a repeat harmless, so the only thing missing
          # was another go.
          upload() {
            for try in 1 2 3; do
              if gh release upload "v$version" "$@" --clobber; then return 0; fi
              echo "upload attempt $try failed; retrying in $((try * 20))s"
              sleep $((try * 20))
            done
            return 1
          }
          upload "${files[@]}"

      # electron-builder's own asset names carry the version, so a link to one dies
      # at the next release. Upload a second copy of each installer under a fixed
      # name as well, which makes
      # https://github.com/robertiuoras/PaneForge/releases/latest/download/PaneForge-Setup.exe
      # a permanent download link the README and any chat message can use. The
      # versioned files and the *.yml update feed are left exactly as they were:
      # the auto-updater reads those and must not see anything new.
      - name: Upload fixed-name copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p stable
          shopt -s nullglob
          found=0
          for f in dist/*"$version"*.exe dist/*"$version"*.dmg dist/*"$version"*.zip; do
            name=$(basename "$f")
            fixed=$(printf '%s' "$name" | sed -e "s/[ -]\{0,1\}${version//./\\.}//" -e 's/ /-/g')
            cp "$f" "stable/$fixed"
            found=1
          done
          if [ "$found" = 0 ]; then echo "no build artifacts matched $version"; exit 1; fi
          ls -l stable
          # Same transient 504 exposure as the step above, same answer.
          for try in 1 2 3; do
            if gh release upload "v$version" stable/* --clobber; then break; fi
            if [ "$try" = 3 ]; then exit 1; fi
            echo "upload attempt $try failed; retrying in $((try * 20))s"
            sleep $((try * 20))
          done

  # One job, after both builds, so the release page itself tells a first-time
  # visitor which of the nine files they want - and what changed since the last
  # version, which scripts/release-notes.mjs reads out of the commit subjects.
  notes:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Tags and full history. The notes are the log between the previous version
      # tag and this one, and checkout's default single shallow commit has neither -
      # which would publish the "nothing to list" fallback on every release instead
      # of the changes, silently and without failing anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write install instructions into the release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # Both builds can fail, in which case there is no release to describe and
          # this job should say so rather than go red for a second reason.
          if ! gh release view "v$version" >/dev/null 2>&1; then
            echo "No release v$version - both builds must have failed. Nothing to write."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          gh release edit "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"

      # `fail-fast: false` means one leg can ship alone, and that failure is SILENT in
      # the only place it matters: the update feed. A release carrying latest-mac.yml and
      # no latest.yml looks finished on the releases page while every Windows copy checks
      # for an update, finds no feed on the newest release, and sits on the old version
      # saying nothing. That is exactly how v0.7.2 went out Windows-only and v0.8.0 went
      # out Mac-only within fifteen minutes of each other. Neither run was red for it.
      #
      # So the feeds are the assertion, not the installers: an installer nobody's updater
      # can find is not shipped. Missing one names the platform that is now stuck.
      - name: Both update feeds must be on the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::No release v$version at all - both builds failed. Nothing shipped."
            exit 1
          fi
          assets=$(gh release view "v$version" --json assets -q '.assets[].name')
          missing=0
          grep -qx 'latest.yml'     <<<"$assets" || { echo "::error::no latest.yml on v$version - every WINDOWS copy is stuck on the previous version and will not say so"; missing=1; }
          grep -qx 'latest-mac.yml' <<<"$assets" || { echo "::error::no latest-mac.yml on v$version - every MAC copy is stuck on the previous version and will not say so"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "Re-run the failed leg, or build it locally and upload. Assets present:"
            printf '%s\n' "$assets"
            exit 1
          fi
          echo "both feeds present on v$version"
