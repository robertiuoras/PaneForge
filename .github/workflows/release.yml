# Builds PaneForge for Windows and Apple Silicon and publishes both to a GitHub
# Release, which is also the feed the app's auto-updater reads.
#
# Triggered by pushing a tag (`npm run ship` does that for you) or by hand from
# the Actions tab. Public repo, so these minutes are free.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-14 # Apple Silicon runner: arm64 native, no cross-build
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app is not code signed: notarising needs a paid Apple account.
          # First launch on a friend's Mac therefore needs right-click > Open.
          CSC_IDENTITY_AUTO_DISCOVERY: false
